name: Inspect PocketWise Build Settings

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q PocketWiseAndroid-project.zip -d project

      - name: Display Gradle configuration
        run: |
          cd project/PocketWiseAndroid
          echo "ROOT BUILD GRADLE"
          cat build.gradle
          echo "APP BUILD GRADLE"
          cat app/build.gradle
          echo "GRADLE PROPERTIES"
          cat gradle.properties
          echo "SETTINGS GRADLE"
          cat settings.gradle
          echo "ALL PROJECT FILES"
          find . -type f | sort
