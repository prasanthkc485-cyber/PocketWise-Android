name: Check PocketWise Android Project

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          ls -la
          unzip -l PocketWiseAndroid-project.zip

      - name: Extract project
        run: |
          mkdir project
          unzip -q PocketWiseAndroid-project.zip -d project
          echo "PROJECT FILE STRUCTURE:"
          find project -maxdepth 8 -type f | sort
